name: Deploy to WordPress.org

on:
  push:
    tags:
      # Exact versions only; release candidates (e.g. 3.0.0-rc.1) never deploy to WordPress.org.
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Verify tag matches plugin version and Stable tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          MAIN=$(grep -l "Plugin Name:" ./*.php | head -n1)
          HEADER=$(grep -m1 -E "^\s*\*?\s*Version:" "$MAIN" | sed -E 's/.*Version:\s*//' | tr -d '[:space:]')
          STABLE=$(grep -m1 -i "^Stable tag:" readme.txt | sed -E 's/^Stable tag:\s*//I' | tr -d '[:space:]')
          echo "tag=$TAG header=$HEADER stable=$STABLE ($MAIN)"
          if [ "$TAG" != "$HEADER" ] || [ "$TAG" != "$STABLE" ]; then
            echo "::error::Tag, plugin header Version and readme.txt Stable tag must all match."
            exit 1
          fi

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none

      # The WordPress.org SVN hook rejects any file that fails php -l; fail here instead.
      - name: Lint shipped PHP
        run: find . -name '*.php' -not -path './vendor/*' -not -path './tests/*' -not -path './bin/*' -print0 | xargs -0 -n1 -P4 php -d display_errors=stderr -l > /dev/null

      - name: Deploy to WordPress.org SVN
        id: deploy
        uses: 10up/action-wordpress-plugin-deploy@stable
        with:
          generate-zip: true
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: wp-smart-property

      - name: Attach ZIP to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.deploy.outputs.zip-path }}
